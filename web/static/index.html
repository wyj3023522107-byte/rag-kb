<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K12智能学习助手</title>
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <!-- KaTeX 数学公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- Marked.js Markdown解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <nav class="top-nav">
            <div class="nav-left">
                <a href="/" class="logo">
                    <span class="logo-icon">K</span>
                    <span class="logo-text">K12学习助手</span>
                </a>
                <div class="nav-menu">
                    <a href="/" class="nav-item active">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span>对话</span>
                    </a>
                    <a href="/knowledge" class="nav-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <span>知识库</span>
                    </a>
                </div>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" title="切换主题">
                    <span>🌙</span>
                    <span>暗色</span>
                </button>
            </div>
        </nav>

        <!-- 主内容区域 -->
        <div class="main-wrapper">
            <!-- 可调节侧边栏 -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-title">历史记录</span>
                    <button class="btn btn-primary btn-icon" id="newChatBtn" title="新建对话">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <div class="sidebar-content">
                    <ul class="history-list" id="historyList">
                        <!-- 动态加载 -->
                    </ul>
                </div>
                <div class="resize-handle"></div>
            </aside>

            <!-- 聊天主区域 -->
            <main class="chat-main">
                <!-- 消息容器 -->
                <div class="messages-container" id="messagesContainer">
                    <!-- 欢迎消息 -->
                    <div class="welcome-message">
                        <div class="welcome-icon">🎓</div>
                        <h2>你好，我是K12学习助手</h2>
                        <p>我可以帮你解答学科问题、辅导作业、疏导情绪</p>
                        <div class="quick-actions">
                            <button class="quick-btn" data-query="请帮我讲解勾股定理">
                                📐 勾股定理讲解
                            </button>
                            <button class="quick-btn" data-query="这道方程题怎么做：2x + 5 = 13">
                                📝 作业辅导
                            </button>
                            <button class="quick-btn" data-query="最近学习压力有点大">
                                💬 情绪疏导
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 输入区域 -->
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea
                            id="messageInput"
                            placeholder="请输入你的问题..."
                            rows="1"
                        ></textarea>
                        <button id="sendBtn" class="send-btn">
                            <span>发送</span>
                            <span>✨</span>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/sidebar.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/markdown.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>

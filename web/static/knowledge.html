<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 - K12智能学习助手</title>
    <meta name="theme-color" content="#f8f7fc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0a10" media="(prefers-color-scheme: dark)">
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/knowledge.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <nav class="top-nav">
            <div class="nav-left">
                <a href="/" class="logo">
                    <span class="logo-icon">K</span>
                    <span class="logo-text">K12学习助手</span>
                </a>
                <div class="nav-menu">
                    <a href="/" class="nav-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span>对话</span>
                    </a>
                    <a href="/knowledge" class="nav-item active">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <span>知识库</span>
                    </a>
                </div>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" title="切换主题" aria-label="切换深色/浅色主题">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <span>主题</span>
                </button>
                <a href="/?new=true" class="btn btn-primary btn-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    新对话
                </a>
            </div>
        </nav>

        <!-- 主内容区域 -->
        <div class="main-wrapper">
            <main class="knowledge-main">
                <!-- 页面标题 + 统计信息 -->
                <div class="page-header-row">
                    <div class="page-header-left">
                        <h2>知识库</h2>
                        <p class="page-subtitle">上传文档，构建专属知识库</p>
                    </div>
                    <div class="page-stats">
                        <div class="stat-item">
                            <span class="stat-num" id="totalDocs">0</span>
                            <span class="stat-label">文档</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-num" id="totalChunks">0</span>
                            <span class="stat-label">切片</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-num" id="storageSize">0</span>
                            <span class="stat-label">MB</span>
                        </div>
                    </div>
                </div>

                <!-- 上传区域 -->
                <section class="upload-section">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-content">
                            <div class="upload-icon">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                            </div>
                            <div class="upload-text">
                                <p class="upload-main-text">拖拽文件到此处，或 <span class="upload-link">点击上传</span></p>
                                <p class="upload-hint">支持 PDF、Word、TXT、Markdown 格式</p>
                            </div>
                        </div>
                        <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.txt,.md" hidden>
                    </div>

                    <div class="upload-form" id="uploadForm" style="display: none;">
                        <div class="selected-file">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            <span id="selectedFileName">文件名.pdf</span>
                        </div>

                        <div class="form-grid">
                            <div class="form-group">
                                <label>分类</label>
                                <select id="subjectSelect">
                                    <option value="" selected>自动识别</option>
                                    <option value="数学">数学</option>
                                    <option value="语文">语文</option>
                                    <option value="英语">英语</option>
                                    <option value="物理">物理</option>
                                    <option value="化学">化学</option>
                                    <option value="生物">生物</option>
                                    <option value="历史">历史</option>
                                    <option value="地理">地理</option>
                                    <option value="政治">政治</option>
                                    <option value="公司文档">公司文档</option>
                                    <option value="技术文档">技术文档</option>
                                    <option value="产品文档">产品文档</option>
                                    <option value="研究报告">研究报告</option>
                                    <option value="政策法规">政策法规</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>年级</label>
                                <select id="gradeSelect" multiple>
                                    <option value="小学">小学</option>
                                    <option value="初一">初一</option>
                                    <option value="初二">初二</option>
                                    <option value="初三">初三</option>
                                    <option value="高一">高一</option>
                                    <option value="高二">高二</option>
                                    <option value="高三">高三</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>标题</label>
                                <input type="text" id="titleInput" placeholder="默认使用文件名">
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="checkbox-label">
                                <input type="checkbox" id="autoClassify" checked>
                                <span>智能分类（自动识别类型、关键词）</span>
                            </label>
                        </div>

                        <div class="form-actions">
                            <button class="btn btn-secondary" id="cancelBtn">取消</button>
                            <button class="btn btn-primary" id="uploadBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                上传
                            </button>
                        </div>
                    </div>
                </section>

                <!-- 文档列表 -->
                <section class="documents-section">
                    <div class="section-header">
                        <h3>文档列表</h3>
                        <div class="section-actions">
                            <select id="filterSubject" class="filter-select">
                                <option value="">全部分类</option>
                                <option value="未分类">未分类</option>
                                <option value="数学">数学</option>
                                <option value="语文">语文</option>
                                <option value="英语">英语</option>
                                <option value="物理">物理</option>
                                <option value="化学">化学</option>
                                <option value="生物">生物</option>
                                <option value="历史">历史</option>
                                <option value="地理">地理</option>
                                <option value="政治">政治</option>
                                <option value="公司文档">公司文档</option>
                                <option value="技术文档">技术文档</option>
                            </select>
                        </div>
                    </div>

                    <div class="documents-table-wrapper">
                        <table class="documents-table">
                            <thead>
                                <tr>
                                    <th class="col-name">文档名称</th>
                                    <th class="col-category">分类</th>
                                    <th class="col-chunks">切片</th>
                                    <th class="col-time">上传时间</th>
                                    <th class="col-actions">操作</th>
                                </tr>
                            </thead>
                            <tbody id="documentsList">
                                <tr class="empty-row">
                                    <td colspan="5">
                                        <div class="empty-content">
                                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                <polyline points="14 2 14 8 20 8"></polyline>
                                            </svg>
                                            <p>暂无文档，上传开始构建知识库</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- 切片查看模态框 -->
    <div class="modal" id="chunksModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="chunksModalTitle">文档切片</h3>
                <button class="modal-close" onclick="closeChunksModal()">&times;</button>
            </div>
            <div class="modal-body" id="chunksModalBody">
                <!-- 切片内容将动态加载 -->
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/knowledge.js"></script>
</body>
</html>

[project]
name = "rag-kb"
version = "1.0.0"
description = "基于 LangGraph 的教育问答 Agent，支持意图识别、混合检索、RAG 生成"
requires-python = ">=3.10"

dependencies = [
    # Agent框架
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",

    # LLM
    "dashscope>=1.17.0",

    # 向量存储
    "chromadb>=0.4.0",
    "whoosh>=2.7.4",

    # 文档处理
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",

    # Web后端
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",

    # 工具库
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
